# Portable global defaults for Codex.
# Copy or merge into ~/.codex/config.toml. Project trust records and cache metadata
# are intentionally machine-local.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
personality = "pragmatic"
approvals_reviewer = "user"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.blender]
command = "uvx"
args = ["blender-mcp"]

[features]
unified_exec = true
shell_snapshot = true
multi_agent = true
js_repl = true
guardian_approval = true
prevent_idle_sleep = true

[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

[plugins."browser-use@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true
